! ==============================================================================
! Cisco IOL Layer 2 Core Switch (SOC-Core-SW1)
! Role: Core VLAN Segmentation & SPAN Traffic Mirroring for Suricata NIDS
! ==============================================================================

hostname SOC-Core-SW1
!
spanning-tree mode rapid-pvst
!
vlan 10
 name Corporate-LAN
!
vlan 20
 name DMZ-Services
!
vlan 30
 name OT-ICS-Zone
!
vlan 99
 name SPAN-Monitoring
!
! Uplink / Trunk to OPNsense Next-Gen Firewall
interface Ethernet0/0
 description Trunk-to-OPNsense-Firewall
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,99
 no shutdown
!
! DMZ Web Server Host Port
interface Ethernet0/1
 description DMZ-Web-Server-Port
 switchport mode access
 switchport access vlan 20
 spanning-tree portfast
 no shutdown
!
! OT / ICS PLC Host Port
interface Ethernet0/2
 description OT-PLC-Node-Port
 switchport mode access
 switchport access vlan 30
 spanning-tree portfast
 no shutdown
!
! SPAN Destination Port -> Monitored by Suricata NIDS
interface Ethernet0/3
 description SPAN-Monitor-Output-to-Suricata
 switchport mode access
 switchport access vlan 99
 no shutdown
!
! SPAN Port Mirroring Session Definition
monitor session 1 source interface Ethernet0/0 both
monitor session 1 source interface Ethernet0/1 both
monitor session 1 source interface Ethernet0/2 both
monitor session 1 destination interface Ethernet0/3
!
! Management SVI
interface Vlan10
 ip address 10.10.10.2 255.255.255.0
 no shutdown
!
ip default-gateway 10.10.10.1
!
line con 0
 logging synchronous
 exec-timeout 0 0
line vty 0 4
 login
!
end
