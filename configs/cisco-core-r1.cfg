! ==============================================================================
! Cisco 7200 Enterprise Router (SOC-Core-R1)
! Role: Edge WAN Routing, Dynamic OSPF/BGP, NetFlow & Syslog Telemetry
! ==============================================================================

hostname SOC-Core-R1
!
ip cef
!
! External WAN Interface connected to Internet Cloud (pnet1)
interface FastEthernet0/0
 description WAN-Internet-Cloud
 ip address dhcp
 no shutdown
!
! Internal Transit Link to OPNsense Core Interface
interface FastEthernet0/1
 description Core-Interconnect-to-OPNsense
 ip address 10.10.0.1 255.255.255.252
 no shutdown
!
! Dynamic Routing Protocol (OSPF Area 0)
router ospf 1
 log-adjacency-changes
 network 10.10.0.0 0.0.0.3 area 0
 network 10.10.10.0 0.0.0.255 area 0
 network 10.10.20.0 0.0.0.255 area 0
 network 10.10.30.0 0.0.0.255 area 0
!
! Default Static Route out to Internet Gateway
ip route 0.0.0.0 0.0.0.0 172.31.255.1
!
! SOC Logging & Telemetry Configuration
logging trap debugging
logging facility local7
!
line con 0
 logging synchronous
 exec-timeout 0 0
line vty 0 4
 login
!
end
